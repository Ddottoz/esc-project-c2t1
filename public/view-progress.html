<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Progress Report</title>
<link rel="stylesheet" href="stylesheets/view-progress.css">
</head>
<body>
  <!-- temp navbar -->
  <div class="navbar">
      <div class="brand">
          <img src="./images/das-logo.jpg" class="logo">
          <div class="tabs">
              <a href="#">Bands</a>
              <a href="students-list.html" class="active">Students</a>
              <a href="#">Educators</a>
          </div>
      </div>
      <span class="account-icon">&#9679;</span>
  </div>

  <div id="analysis-page" class="analysis-page sidebar-collapsed">
    <div class="workspace">

      <aside id="sidebar" class="sidebar">
        <button id="sidebar-toggle" type="button" class="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
          <span class="toggle-arrow">‹</span>
          <span class="toggle-menu">☰</span>
        </button>

        <section class="band-information">
          <h2 id="sidebarBand"></h2>
          <h3 id="sidebarName"></h3>
        </section>

        <a href="students-list.html" class="back-to-submissions">&lt; Back to Students</a>

        <nav class="sidebar-navigation">
          <a href="#" id="navDashboard" class="sidebar-link">Dashboard</a>
          <a href="#" id="navProgress" class="sidebar-link active">Progress</a>
          <a href="#" id="navStudentInfo" class="sidebar-link">Student Info</a>
        </nav>

      </aside>

      <main class="content-wrap">
        <div class="card">

          <div class="card-header">
            <h1>Progress Report</h1>
            <button class="btn btn-primary" id="generateBtn">Generate</button>
          </div>

          <p class="student-name" id="studentName"></p>
          <p class="student-band" id="studentBand"></p>

          <!-- term-section elements are injected here at runtime by
               renderProgressView()/showEmptyState() in view-progress.js -->

        </div>
      </main>

    </div>
  </div>

  <script src="javascripts/studentajaxclient.js"></script>
  <script src="javascripts/view-progress.js"></script>
</body>
</html>
