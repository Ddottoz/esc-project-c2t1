<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Progress Report</title>
<link rel="stylesheet" href="stylesheets/view-progress.css">
</head>
<body>
  <header class="top-nav">
      <a class="brand" href="/bands" aria-label="DAS home">
          <img src="./images/das-logo.jpg" alt="DAS">
      </a>
      <nav aria-label="Primary navigation">
          <a href="/bands">Bands</a>
          <a href="students-list.html">Students</a>
      </nav>
      <a class="profile-icon" href="/educator" aria-label="User profile">
          <img src="./images/profile_icon.webp" alt="" aria-hidden="true">
      </a>
  </header>

  <div id="analysis-page" class="analysis-page sidebar-collapsed">
    <div class="workspace">

      <aside class="sidebar student-sidebar" id="sidebar">
          <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true">
              <span class="toggle-arrow">‹</span><span class="toggle-menu">☰</span>
          </button>

          <div class="sidebar-heading">
              <h1>Profile</h1>
              <p id="sidebarBand"></p>
              <p id="sidebarStudentName"></p>
              <a class="back-link" href="#">‹ Back to Enrollment</a>
          </div>

          <nav aria-label="Student navigation">
              <a class="sidebar-link" id="navDashboard" href="#">
                  <span class="sidebar-icon dashboard-sidebar-icon" aria-hidden="true"></span>
                  <strong>Dashboard</strong>
              </a>
              <a class="sidebar-link active" id="navProgress" href="#">
                  <span class="sidebar-icon progress-sidebar-icon" aria-hidden="true"></span>
                  <strong>Progress</strong>
              </a>
              <a class="sidebar-link" id="navStudentInfo" href="#">
                  <span class="sidebar-icon student-info-icon" aria-hidden="true"></span>
                  <strong>Student Info</strong>
              </a>
          </nav>
      </aside>

      <main class="content-wrap">
        <div class="card">

          <div class="card-header">
            <h1>Progress Report</h1>
            <button class="btn btn-primary" id="generateBtn">Generate</button>
          </div>

          <p class="student-name" id="studentName"></p>
          <p class="student-band" id="studentBand"></p>

          <!-- term-section elements are injected here at runtime by
               renderProgressView()/showEmptyState() in view-progress.js -->

        </div>
      </main>

    </div>
  </div>

  <script src="javascripts/studentajaxclient.js"></script>
  <script src="javascripts/view-progress.js"></script>
</body>
</html>
