<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Students</title>
        <link rel="stylesheet" href="stylesheets/students-list.css">
    </head>

    <body>
        <header class="top-nav">
            <a class="brand" href="/bands" aria-label="DAS home">
                <img src="./images/das-logo.jpg" alt="DAS">
            </a>
            <nav aria-label="Primary navigation">
                <a href="/bands">Bands</a>
                <a class="active" href="students-list.html">Students</a>
            </nav>
            <a class="profile-icon" href="/educator" aria-label="User profile">
                <img src="./images/profile_icon.webp" alt="" aria-hidden="true">
            </a>
        </header>

        <div class="page">
            <div class="page-header">
                <h1>Students</h1>
                <div class="filters">
                    <select id="filterBand"><option value="">View by Current Band</option></select>
                    <select id="filterCentre"><option value="">View by Centre</option></select>
                    <select id="filterEducator"><option value="">View by Educator</option></select>
                    <select id="filterSchLevel"><option value="">View by School Level</option></select>
                    <select id="filterGraduated">
                        <option value="">Graduated</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>
            </div>

            <div class="action-row">
                <button class="secondary" id="downloadBtn">&#8681; Download Student List</button>
                <a href="add-edit-student.html" class="button-link">+ Add Student</a>
                <input type="text" id="searchBox" placeholder="Search Student Name/NRIC">
            </div>

            <table class="student-table">
                <thead>
                    <tr>
                        <th><button class="sort-button" data-sort="name" data-type="text">Name <span class="sort-icon" aria-hidden="true"></span></button></th>
                        <th><button class="sort-button" data-sort="band" data-type="text">Band <span class="sort-icon" aria-hidden="true"></span></button></th>
                        <th><button class="sort-button" data-sort="centre" data-type="text">Centre <span class="sort-icon" aria-hidden="true"></span></button></th>
                        <th><button class="sort-button" data-sort="educator" data-type="text">Educator <span class="sort-icon" aria-hidden="true"></span></button></th>
                        <th><button class="sort-button" data-sort="nric" data-type="text">NRIC <span class="sort-icon" aria-hidden="true"></span></button></th>
                        <th><button class="sort-button" data-sort="schoolLevel" data-type="text">School Level <span class="sort-icon" aria-hidden="true"></span></button></th>
                        <th><button class="sort-button" data-sort="school" data-type="text">School <span class="sort-icon" aria-hidden="true"></span></button></th>
                        <th><button class="sort-button" data-sort="age" data-type="number">Age <span class="sort-icon" aria-hidden="true"></span></button></th>
                        <th><button class="sort-button" data-sort="enrollmentDate" data-type="date">Enrollment Date <span class="sort-icon" aria-hidden="true"></span></button></th>
                        <th><button class="sort-button" data-sort="graduated" data-type="number">Graduated <span class="sort-icon" aria-hidden="true"></span></button></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="studentRows"></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">No students match these filters.</div>
        </div>

        <script src="javascripts/studentajaxclient.js"></script>
        <script src="javascripts/utils.js"></script>
        <script src="javascripts/students-list.js"></script>
    </body>
</html>
